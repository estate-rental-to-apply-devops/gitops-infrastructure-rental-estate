apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-app-ns

resources:
  - namespace.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: microservice
    releaseName: config-service
    valuesFile: config-service-values.yaml
  - name: microservice
    releaseName: gateway-service
    valuesFile: gateway-service-values.yaml
  - name: microservice
    releaseName: user-management-service
    valuesFile: user-management-service-values.yaml
  - name: microservice
    releaseName: authorization-service
    valuesFile: authorization-service-values.yaml
  - name: microservice
    releaseName: frontend
    valuesFile: frontend-values.yaml
