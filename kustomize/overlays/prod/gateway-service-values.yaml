replicaCount: 1

image:
  repository: 240797212774.dkr.ecr.eu-west-1.amazonaws.com/gitops-estate/gateway-service
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 8880

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: CONFIG_SERVER_URL
    value: "http://config-service:8888"
  - name: AUTH_SERVER_URL
    value: "http://authorization-service-microservice:9000"
  - name: USER_MANAGEMENT_SERVICE_URL
    value: "http://user-management-service-microservice:8081"
  - name: JAVA_OPTS
    value: "-Xmx384m -DUSER-MANAGEMENT-SERVICE-URL=http://user-management-service-microservice:8081 -DAUTH_SERVER_URL=http://authorization-service-microservice:9000"

initContainers:
  - name: wait-for-config
    image: busybox:1.28
    command: ['sh', '-c', 'until nc -z config-service 8888; do echo waiting for config; sleep 2; done;']

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: gitops-estate
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
  hosts:
    - host: ""
      paths:
        - path: /api
          pathType: Prefix
          backend:
            service:
              port: 8880
