replicaCount: 1

image:
  repository: 240797212774.dkr.ecr.eu-west-1.amazonaws.com/gitops-estate/authorization-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 9000

env:
  - name: SPRING_APPLICATION_NAME
    value: "authorization-service"
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: CONFIG_SERVER_URL
    value: "http://config-service:8888"
  - name: JWT_ISSUER
    value: "http://authorization-service-microservice:9000"
  - name: USER_MANAGEMENT_SERVICE_URL
    value: "http://user-management-service-microservice:8081"
  - name: JAVA_OPTS
    value: "-Xmx384m -DUSER-MANAGEMENT-SERVICE-URL=http://user-management-service-microservice:8081"

initContainers:
  - name: wait-for-config
    image: busybox:1.28
    command: ['sh', '-c', 'until nc -z config-service 8888; do echo waiting for config; sleep 2; done;']
