replicaCount: 1

image:
  repository: 240797212774.dkr.ecr.eu-west-1.amazonaws.com/gitops-estate/user-management-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8081

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: CONFIG_SERVER_URL
    value: "http://config-service:8888"
  # You will need to replace <RDS_ENDPOINT> with your actual aws_db_instance.mysql.address from Terraform
  - name: PROD_DB_URL
    value: "jdbc:mysql://gitops-estate-mysql.c9se8e248j5b.eu-west-1.rds.amazonaws.com:3306/userdb?createDatabaseIfNotExist=true&useSSL=false"

envFromSecrets:
  - name: mysql-db-credentials-secret

initContainers:
  - name: wait-for-config
    image: busybox:1.28
    command: ['sh', '-c', 'until nc -z config-service 8888; do echo waiting for config; sleep 2; done;']

serviceAccount:
  create: true
  name: gitops-app-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::240797212774:role/gitops-estate-rds-secret-accessor-role

secretProviderClass:
  enabled: true
  name: gitops-mysql-secrets
  spec:
    provider: aws
    secretObjects:
      - secretName: mysql-db-credentials-secret
        type: Opaque
        data:
          - objectName: PROD_DB_USERNAME
            key: PROD_DB_USERNAME
          - objectName: PROD_DB_PASSWORD
            key: PROD_DB_PASSWORD
    parameters:
      objects: |
        - objectName: "gitops-estate-mysql-credentials"
          objectType: "secretsmanager"
          jmesPath:
            - path: "username"
              objectAlias: "PROD_DB_USERNAME"
            - path: "password"
              objectAlias: "PROD_DB_PASSWORD"
